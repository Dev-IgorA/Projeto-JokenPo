<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Link para as fontes do Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Iosevka+Charon:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Merriweather:ital,opsz,wght@0,18..144,300..900;1,18..144,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Link do arquivo html para estilo no CSS -->
    <link rel="stylesheet" href="Style.css" />

    <!-- Link de comando do arquivo html para script no JavaScript -->
    <script type="module" src="Script.js"></script>

    <title>Jokepô Online</title>
  </head>
  <body>
    <div class="container">
      <h1>Jokepô</h1>

      <div class="buttons-game">
        <!-- Ícones dos buttons retirados pelo site QuackIt -->
        <button id="rock">&#x1F91B;</button>
        <button id="paper">&#x270B;</button>
        <button id="scissors">&#x270C;</button>
      </div>
      <!-- Pontuações -->
      <p class="my-score">Minha pontuação: <span>0</span></p>
      <p class="machine-score">Pontuação adversário: <span>0</span></p>
      <p class="result"></p>
    </div>
  </body>
</html>
